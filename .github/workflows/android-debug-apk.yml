name: ARVIO Android Debug APK

on:
  push:
    branches:
      - feature/live-tv-manager
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvio-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SideloadDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare default configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Inject TMDB API key
        if: ${{ secrets.TMDB_API_KEY != '' }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: printf '\\nTMDB_API_KEY=%s\\n' "$TMDB_API_KEY" >> secrets.properties

      - name: Build SideloadDebug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleSideloadDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARVIO-SideloadDebug-${{ github.run_number }}
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ARVIO-build-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
