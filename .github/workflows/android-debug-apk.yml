name: ARVIO Android Debug APK

on:
  push:
    branches:
      - feature/live-tv-manager
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arvio-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SideloadDebug APK
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          sdkmanager \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare default configuration
        run: cp secrets.defaults.properties secrets.properties

      - name: Inject TMDB API key
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path("secrets.properties")
          lines = path.read_text(encoding="utf-8").splitlines()
          lines = [line for line in lines if not line.startswith("TMDB_API_KEY=")]
          key = os.environ.get("TMDB_API_KEY", "").strip()

          if key:
              lines.append("TMDB_API_KEY=" + key)
              print("TMDB_API_KEY configured.")
          else:
              print("::warning::TMDB_API_KEY is not configured.")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Prepare stable APK signing key
        env:
          ARVIO_KEYSTORE_BASE64: ${{ secrets.ARVIO_KEYSTORE_BASE64 }}
          ARVIO_KEYSTORE_PASSWORD: ${{ secrets.ARVIO_KEYSTORE_PASSWORD }}
        run: |
          test -n "$ARVIO_KEYSTORE_BASE64" || { echo "::error::Missing ARVIO_KEYSTORE_BASE64"; exit 1; }
          test -n "$ARVIO_KEYSTORE_PASSWORD" || { echo "::error::Missing ARVIO_KEYSTORE_PASSWORD"; exit 1; }
          KEYSTORE="$RUNNER_TEMP/arvio-sideload.jks"
          printf '%s' "$ARVIO_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ARVIO_KEYSTORE_PASSWORD" -alias arvio-sideload >/dev/null
          echo "ARVIO_KEYSTORE_PATH=$KEYSTORE" >> "$GITHUB_ENV"
          echo "Stable APK signing key verified."

      - name: Build SideloadDebug APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleSideloadDebug \
            --no-daemon \
            --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ARVIO-SideloadDebug-${{ github.run_number }}
          path: app/build/outputs/apk/sideload/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ARVIO-build-reports-${{ github.run_number }}
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
