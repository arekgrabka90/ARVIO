name: ARVIO Profile Preview APK

on:
  push:
    branches:
      - feature/profile-screen-redesign
    paths:
      - ".github/workflows/profile-release-apk.yml"
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "gradle.properties"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: profile-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview-apk:
    name: Build profile preview APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build Play Diagnostics APK
        run: ./gradlew :app:assemblePlayDiagnostics --no-daemon

      - name: Verify APK exists
        run: |
          APK="$(find app/build/outputs/apk/play/diagnostics -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          echo "Preview APK: $APK"
          sha256sum "$APK"

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: arvio-profile-preview-${{ github.run_number }}
          path: app/build/outputs/apk/play/diagnostics/*.apk
          if-no-files-found: error
          retention-days: 7
